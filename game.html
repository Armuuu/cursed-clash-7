<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1320">
<title>Cursed Clash</title>
<style>
  /* ================= COLORS (change these to restyle) ================= */
  :root {
    --bg: #0f1320;
    --panel: #171c2b;
    --arena: #1c2336;
    --grid: rgba(255, 255, 255, 0.06);
    --text: #e8ecf5;
    --muted: #8a94ab;
    --player: #3b82f6;
    --enemy: #ef4444;
    --good: #22c55e;
    --warn: #f59e0b;
    --pad: #2a3350;
  }

  * { box-sizing: border-box; }

  /* No scrolling, no zooming, no text selection, no long-press menu */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; color: inherit; border: 0; cursor: pointer; }

  /* ================= SCREENS ================= */
  .screen {
    position: fixed;
    left: 0; top: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: none;
  }
  .screen.active { display: flex; }

  .grid-bg {
    background-color: var(--arena);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* ---------- Main menu ---------- */
  #menu {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
  #menu h1 {
    margin: 0;
    font-size: clamp(36px, 11vw, 64px);
    letter-spacing: 0.08em;
    text-align: center;
  }
  .big-btn {
    width: min(80vw, 320px);
    padding: 22px 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.06em;
    background: var(--player);
    color: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 0 #1e4fb3;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e4fb3; }

  /* ---------- Game layout ---------- */
  #game { flex-direction: column; }

  #topbar {
    flex: none;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    background: var(--panel);
  }
  .hud-side { flex: 1; min-width: 0; }
  .hud-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 700;
  }
  .hud-side.you .hud-row b { color: var(--player); }
  .hud-side.enemy .hud-row b { color: var(--enemy); }
  #timer {
    width: 64px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .bar { height: 6px; background: rgba(255, 255, 255, 0.15); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 100%; background: var(--good); transition: width 0.15s ease-out; }
  .fill.low { background: var(--warn); }
  .hud-side.you .fill { background: var(--player); }
  .hud-side.enemy .fill { background: var(--enemy); }

  /* Portrait: arena on top, controls underneath. */
  #main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 190px;
    grid-template-areas:
      "arena arena"
      "pad   btns";
  }
  /* Landscape: joystick on the left, arena in the middle, buttons on the right. */
  @media (orientation: landscape) {
    #main {
      grid-template-columns: 170px 1fr 230px;
      grid-template-rows: 1fr;
      grid-template-areas: "pad arena btns";
    }
    #padZone { align-items: flex-end; padding-bottom: 16px; }
  }

  /* ---------- Arena ---------- */
  #arena { grid-area: arena; position: relative; overflow: hidden; }
  #arena::before {            /* simple decoration in the middle */
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 140px; height: 140px;
    border: 2px dashed rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  #hint {                      /* keyboard hint, only shown on desktop */
    display: none;
    position: absolute;
    left: 0; right: 0; bottom: 6px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }
  @media (hover: hover) and (pointer: fine) { #hint { display: block; } }

  /* ---------- Fighters ---------- */
  .fighter { position: absolute; left: 0; top: 0; width: 40px; height: 40px; will-change: transform; }
  .fighter .body {
    width: 100%; height: 100%;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: #fff;
    transition: opacity 0.3s;
  }
  #player .body { background: var(--player); border: 3px solid #bfdbfe; }
  #enemy .body  { background: var(--enemy);  border: 3px solid #7f1d1d; }
  .fighter .body.hit  { animation: hitFlash 0.18s ease-out; }
  .fighter .body.dead { opacity: 0.3; filter: grayscale(1); }

  .tag {                       /* HP text + HP bar above the character */
    position: absolute;
    left: 50%; bottom: 100%;
    margin-bottom: 3px;
    width: 56px;
    transform: translateX(-50%);
    text-align: center;
    font-size: 11px; font-weight: 700; line-height: 1.2;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  .tag .bar { height: 5px; margin-top: 2px; }

  /* ---------- Attack effects + damage numbers ---------- */
  .fx { position: absolute; pointer-events: none; }
  .fx.ring, .fx.wave {
    border: 3px solid currentColor;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: ringPop 0.4s ease-out forwards;
  }
  .fx.wave {
    border-width: 4px;
    background: radial-gradient(circle, transparent 50%, currentColor 140%);
    animation-duration: 0.55s;
  }
  .fx.bolt {
    height: 6px;
    margin-top: -3px;
    border-radius: 3px;
    background: currentColor;
    transform-origin: 0 50%;
    animation: fadeOut 0.3s ease-out forwards;
  }
  .float {
    position: absolute;
    white-space: nowrap;
    font-weight: 900;
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
  }

  @keyframes hitFlash { from { filter: brightness(2.6); } to { filter: brightness(1); } }
  @keyframes ringPop {
    from { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    to   { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
  }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes floatUp {
    from { transform: translate(-50%, 0);     opacity: 1; }
    60%  { opacity: 1; }
    to   { transform: translate(-50%, -44px); opacity: 0; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Controls ---------- */
  #padZone, #btnZone { position: relative; background: var(--panel); }
  #padZone { grid-area: pad; display: flex; align-items: center; justify-content: center; }
  #btnZone { grid-area: btns; }

  /* ---------- Analog joystick ---------- */
  /* The big circle is the base. The small circle (#joyKnob) is the thumbstick. */
  #joystick {
    --size: min(150px, 40vw);          /* base size, shrinks on narrow phones */
    position: relative;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    touch-action: none;                /* the browser must not scroll/zoom here */
    background: radial-gradient(circle at 50% 35%,
      rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03) 65%, rgba(255, 255, 255, 0.07));
    border: 2px solid rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.5), 0 4px 16px rgba(0, 0, 0, 0.45);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  @media (orientation: landscape) { #joystick { --size: 140px; } }
  #joystick::before {                  /* subtle inner ring */
    content: "";
    position: absolute; inset: 16%;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    pointer-events: none;
  }
  #joystick::after {                   /* invisible: touch area a bit bigger than the drawing */
    content: "";
    position: absolute; inset: -14px;
    border-radius: 50%;
  }
  #joyKnob {
    position: absolute;
    left: 50%; top: 50%;
    width: 42%; height: 42%;           /* the JS reads the real size, so you can change this */
    margin: -21% 0 0 -21%;             /* centers the knob (half of its size) */
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #8db9ff, #3b82f6 55%, #1e4fb3);
    border: 2px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.55),
                inset 0 2px 3px rgba(255, 255, 255, 0.5),
                inset 0 -4px 6px rgba(0, 0, 0, 0.25);
    will-change: transform;
    pointer-events: none;
  }
  /* Touch feedback while a finger is on the joystick */
  #joystick.active {
    border-color: rgba(147, 197, 253, 0.65);
    box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.5), 0 0 18px rgba(59, 130, 246, 0.35), 0 4px 16px rgba(0, 0, 0, 0.45);
  }
  #joystick.active #joyKnob { filter: brightness(1.15); }

  /* Round action buttons (positioned from the bottom-right corner) */
  .btn {
    position: absolute;
    border-radius: 50%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--c);
    color: #10131c;
    font-size: 12px; font-weight: 800;
    touch-action: none;
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.25);
  }
  .btn:active { filter: brightness(0.85); transform: scale(0.95); }
  #btnAttack { --c: #ffd54a; width: 84px; height: 84px; right: 8px;  bottom: 8px;   font-size: 15px; }
  #btnSkill1 { --c: #4dd0ff; width: 62px; height: 62px; right: 100px; bottom: 14px; }
  #btnSkill2 { --c: #ff9f43; width: 62px; height: 62px; right: 72px;  bottom: 94px; }
  #btnUlt    { --c: #c77dff; width: 62px; height: 62px; right: 6px;   bottom: 102px; }

  /* Cooldown overlay: dark circle with the seconds left */
  .btn .cd {
    display: none;
    position: absolute; inset: 0;
    align-items: center; justify-content: center;
    background: rgba(10, 12, 20, 0.78);
    color: #fff;
    font-size: 20px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .btn.cooling .cd { display: flex; }

  /* ---------- Victory / Defeat screen ---------- */
  #endScreen {
    position: absolute; inset: 0; z-index: 50;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    background: rgba(8, 10, 18, 0.82);
    animation: fadeIn 0.3s ease-out;
  }
  #endScreen.show { display: flex; }
  #endTitle { margin: 0; font-size: clamp(44px, 14vw, 80px); letter-spacing: 0.06em; }
  #endTitle.win  { color: #4ade80; }
  #endTitle.lose { color: #f87171; }
  #endTime { margin: 0 0 14px; color: var(--muted); font-size: 16px; }
</style>
</head>
<body>

<!-- ================= MAIN MENU ================= -->
<div id="menu" class="screen grid-bg active">
  <h1>CURSED CLASH</h1>
  <button id="playBtn" class="big-btn" type="button">Play</button>
</div>

<!-- ================= GAME ================= -->
<div id="game" class="screen">

  <!-- HUD: both HP bars + match timer -->
  <div id="topbar">
    <div class="hud-side you">
      <div class="hud-row"><b>YOU</b><span id="hudPlayerText">1000/1000</span></div>
      <div class="bar"><div class="fill" id="hudPlayerFill"></div></div>
    </div>
    <div id="timer">0:00</div>
    <div class="hud-side enemy">
      <div class="hud-row"><b>ENEMY</b><span id="hudEnemyText">1000/1000</span></div>
      <div class="bar"><div class="fill" id="hudEnemyFill"></div></div>
    </div>
  </div>

  <div id="main">
    <div id="arena" class="grid-bg">
      <div class="fighter" id="player">
        <div class="tag"><span class="hp-text">1000</span><div class="bar"><div class="fill"></div></div></div>
        <div class="body">YOU</div>
      </div>
      <div class="fighter" id="enemy">
        <div class="tag"><span class="hp-text">1000</span><div class="bar"><div class="fill"></div></div></div>
        <div class="body">BOT</div>
      </div>
      <div id="hint">Move: WASD / arrows &nbsp;|&nbsp; Attack: J &nbsp;|&nbsp; Skill 1: K &nbsp;|&nbsp; Skill 2: L &nbsp;|&nbsp; Ultimate: U</div>
    </div>

    <div id="padZone">
      <div id="joystick"><div id="joyKnob"></div></div>
    </div>

    <div id="btnZone">
      <button class="btn" id="btnSkill2" type="button">Skill 2<span class="cd"></span></button>
      <button class="btn" id="btnUlt"    type="button">Ultimate<span class="cd"></span></button>
      <button class="btn" id="btnSkill1" type="button">Skill 1<span class="cd"></span></button>
      <button class="btn" id="btnAttack" type="button">Attack<span class="cd"></span></button>
    </div>
  </div>

  <!-- Victory / Defeat -->
  <div id="endScreen">
    <h2 id="endTitle">VICTORY</h2>
    <p id="endTime">Match time 0:00</p>
    <button id="restartBtn" class="big-btn" type="button">Restart</button>
  </div>
</div>

<script>
/* =====================================================================
   CURSED CLASH - prototype
   Sections:  1 Settings | 2 Page elements | 3 Game state | 4 Helpers
              5 Movement | 6 Combat | 7 Enemy AI | 8 UI updates
              9 Input (joystick, buttons, keyboard) | 10 Match flow + loop
   Tip: all numbers you will want to tweak are in section 1.
   ===================================================================== */

/* ---------- 1. SETTINGS ---------- */
const FIGHTER_SIZE = 40;     // px, must match .fighter size in the CSS
const TAG_SPACE = 28;        // px kept free above fighters for the HP label
const MAX_HP = 1000;
const PLAYER_SPEED = 200;    // px per second
const ENEMY_SPEED = 200;

// "range" = max distance (center to center, in px) at which the move can hit.
// "shape" only changes the visual effect: hit / bolt / burst / nova.
const PLAYER_MOVES = {
  basic:  { damage: 20,  cooldown: 0.5, range: 75,  shape: 'hit',   color: '#ffd54a' },
  skill1: { damage: 50, cooldown: 3,   range: 190, shape: 'bolt',  color: '#4dd0ff' },
  skill2: { damage: 100, cooldown: 5,   range: 120, shape: 'burst', color: '#ff9f43' },
  ult:    { damage: 150, cooldown: 15,  range: 170, shape: 'nova',  color: '#c77dff' }
};
const ENEMY_MOVES = {
  basic:  { damage: 20,  cooldown: 0.5, range: 75,  shape: 'hit',   color: '#ffd54a' },
  skill1: { damage: 50, cooldown: 3,   range: 190, shape: 'bolt',  color: '#4dd0ff' },
  skill2: { damage: 100, cooldown: 5,   range: 120, shape: 'burst', color: '#ff9f43' },
  ult:    { damage: 150, cooldown: 15,  range: 170, shape: 'nova',  color: '#c77dff' }
};

const AI = {
  startDelay: 1.0,        // seconds the enemy waits at match start
  stopDistance: 65,       // stops walking when this close to the player
  attackPause: 0.6,       // minimum seconds between two enemy attacks
  lowHpFraction: 0.3,     // "low health" = 30% HP or less
  retreatCheckEvery: 4,   // while low on HP, roll the dice every 4 seconds...
  retreatChance: 0.5,     // ...with this chance to retreat
  retreatTime: 1.5        // how long one retreat lasts (seconds)
};

/* ---------- 2. PAGE ELEMENTS ---------- */
const $ = (id) => document.getElementById(id);

const menuScreen = $('menu');
const gameScreen = $('game');
const arenaEl = $('arena');
const joystickEl = $('joystick');
const joyKnobEl = $('joyKnob');
const timerEl = $('timer');
const endScreen = $('endScreen');
const endTitle = $('endTitle');
const endTime = $('endTime');

// Each on-screen action button is linked to a move name from PLAYER_MOVES.
const moveButtons = [
  { key: 'basic',  el: $('btnAttack'), showNumber: false },
  { key: 'skill1', el: $('btnSkill1'), showNumber: true },
  { key: 'skill2', el: $('btnSkill2'), showNumber: true },
  { key: 'ult',    el: $('btnUlt'),    showNumber: true }
];

/* ---------- 3. GAME STATE ---------- */
const state = { running: false, over: false, time: 0 };   // time = seconds since match start
let arenaW = 0;
let arenaH = 0;
let rafId = 0;
let lastTs = 0;
let tooFarShownAt = -1;

function createFighter(el, hudPrefix, moves, speed) {
  return {
    el: el,
    bodyEl: el.querySelector('.body'),
    fillEl: el.querySelector('.fill'),
    textEl: el.querySelector('.hp-text'),
    hudFill: $(hudPrefix + 'Fill'),
    hudText: $(hudPrefix + 'Text'),
    moves: moves,
    speed: speed,
    x: 0, y: 0,                 // top-left corner inside the arena
    hp: MAX_HP, maxHp: MAX_HP,
    alive: true,
    readyAt: {},                // move name -> state.time when it is ready again
    nextAttackAt: 0,            // enemy AI only: short pause between attacks
    retreatUntil: 0,            // enemy AI only
    nextRetreatRoll: 0          // enemy AI only
  };
}

const player = createFighter($('player'), 'hudPlayer', PLAYER_MOVES, PLAYER_SPEED);
const enemy = createFighter($('enemy'), 'hudEnemy', ENEMY_MOVES, ENEMY_SPEED);

function resetFighter(f) {
  f.hp = f.maxHp;
  f.alive = true;
  f.readyAt = {};
  for (const key in f.moves) f.readyAt[key] = 0;
  f.nextAttackAt = 0;
  f.retreatUntil = 0;
  f.nextRetreatRoll = 0;
  f.bodyEl.classList.remove('dead', 'hit');
  updateHealthUI(f);
}

/* ---------- 4. HELPERS ---------- */
function centerOf(f) {
  return { x: f.x + FIGHTER_SIZE / 2, y: f.y + FIGHTER_SIZE / 2 };
}

function distanceBetween(a, b) {
  const ca = centerOf(a);
  const cb = centerOf(b);
  return Math.hypot(ca.x - cb.x, ca.y - cb.y);
}

function formatTime(seconds) {
  const s = Math.floor(seconds);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function measureArena() {
  arenaW = arenaEl.clientWidth;
  arenaH = arenaEl.clientHeight;
}

// Keep a fighter fully inside the arena (with room on top for the HP label).
function clampToArena(f) {
  f.x = Math.max(0, Math.min(arenaW - FIGHTER_SIZE, f.x));
  f.y = Math.max(TAG_SPACE, Math.min(arenaH - FIGHTER_SIZE, f.y));
}

// Put the fighters at opposite sides of the arena.
function placeFighters() {
  if (arenaW > arenaH) {          // wide arena (landscape): left vs right
    player.x = arenaW * 0.15 - FIGHTER_SIZE / 2;
    enemy.x = arenaW * 0.85 - FIGHTER_SIZE / 2;
    player.y = enemy.y = arenaH / 2 - FIGHTER_SIZE / 2;
  } else {                        // tall arena (portrait): bottom vs top
    player.x = enemy.x = arenaW / 2 - FIGHTER_SIZE / 2;
    player.y = arenaH * 0.8 - FIGHTER_SIZE / 2;
    enemy.y = arenaH * 0.2 - FIGHTER_SIZE / 2;
  }
  clampToArena(player);
  clampToArena(enemy);
}

/* ---------- 5. MOVEMENT ---------- */
// Move a fighter in direction (dirX, dirY). The direction is normalised so
// diagonal movement is not faster than straight movement.
// "strength" (0 to 1) scales the speed: 1 = full speed, 0.3 = slow walk.
function moveFighter(f, dirX, dirY, dt, strength = 1) {
  const len = Math.hypot(dirX, dirY);
  if (len === 0) return;
  const distance = f.speed * strength * dt;
  f.x += (dirX / len) * distance;
  f.y += (dirY / len) * distance;
  clampToArena(f);
}

// Where does the player want to go this frame?
// Keyboard = full speed. Joystick = speed depends on how far it is pushed.
function getMoveInput() {
  const kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const ky = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (kx !== 0 || ky !== 0) return { x: kx, y: ky, strength: 1 };
  return { x: joy.x, y: joy.y, strength: joy.strength };
}

function updatePlayerMovement(dt) {
  if (!player.alive) return;
  const input = getMoveInput();
  if (input.strength > 0) moveFighter(player, input.x, input.y, dt, input.strength);
}

/* ---------- 6. COMBAT ---------- */
// Try to use a move. Returns true if it was used.
// Every attack is resolved instantly: range check -> damage once -> effect.
// That is why one attack can never damage the target twice.
function useMove(attacker, target, key) {
  if (!state.running || !attacker.alive || !target.alive) return false;
  const move = attacker.moves[key];

  if (state.time < attacker.readyAt[key]) return false;           // still on cooldown

  if (distanceBetween(attacker, target) > move.range) {           // target too far away
    if (attacker === player && state.time - tooFarShownAt > 0.5) {
      tooFarShownAt = state.time;
      showFloatText(player, 'Too far', '#ffffff', 13);
    }
    return false;                                                  // cooldown is NOT used
  }

  attacker.readyAt[key] = state.time + move.cooldown;
  spawnEffect(attacker, target, move);
  dealDamage(target, move.damage);
  return true;
}

function dealDamage(target, amount) {
  target.hp = Math.max(0, target.hp - amount);
  updateHealthUI(target);
  flashHit(target);
  showFloatText(target, '-' + amount, target === player ? '#ff8a8a' : '#ffe27a', 14 + amount / 12);

  if (target.hp === 0) {
    target.alive = false;
    target.bodyEl.classList.add('dead');
    endMatch(target === player ? enemy : player);
  }
}

function flashHit(f) {
  f.bodyEl.classList.remove('hit');
  void f.bodyEl.offsetWidth;          // restart the CSS animation
  f.bodyEl.classList.add('hit');
}

// ----- visual effects (drawn with plain divs) -----
function addFx(className, x, y, width, height, color) {
  const el = document.createElement('div');
  el.className = 'fx ' + className;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = width + 'px';
  if (height) el.style.height = height + 'px';
  el.style.color = color;             // the CSS uses currentColor
  arenaEl.appendChild(el);
  setTimeout(() => el.remove(), 700);
  return el;
}

function spawnEffect(attacker, target, move) {
  const a = centerOf(attacker);
  const t = centerOf(target);

  if (move.shape === 'bolt') {
    // a line from the attacker to the target + a ring on the target
    const length = Math.hypot(t.x - a.x, t.y - a.y);
    const bolt = addFx('bolt', a.x, a.y, length, 0, move.color);
    bolt.style.transform = 'rotate(' + Math.atan2(t.y - a.y, t.x - a.x) + 'rad)';
    addFx('ring', t.x, t.y, 56, 56, move.color);
  } else if (move.shape === 'hit') {
    addFx('ring', t.x, t.y, 48, 48, move.color);
  } else {
    // burst / nova: a big wave around the attacker (its size = the move range)
    addFx('wave', a.x, a.y, move.range * 2, move.range * 2, move.color);
    addFx('ring', t.x, t.y, 60, 60, move.color);
  }
}

function showFloatText(f, text, color, size) {
  const c = centerOf(f);
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  el.style.left = (c.x + Math.random() * 20 - 10) + 'px';
  el.style.top = (f.y + 4) + 'px';
  el.style.color = color;
  el.style.fontSize = size + 'px';
  arenaEl.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

/* ---------- 7. ENEMY AI ---------- */
// Simple rules, checked every frame:
//   A) retreating?  -> walk away from the player
//   B) low on HP?   -> sometimes start a short retreat
//   C) too far?     -> walk towards the player
//   D) ready + in range? -> attack (skill first, then basic attack)
function updateEnemyAI(dt) {
  if (!enemy.alive || !player.alive) return;
  if (state.time < AI.startDelay) return;

  const toPlayerX = player.x - enemy.x;
  const toPlayerY = player.y - enemy.y;
  const dist = distanceBetween(enemy, player);

  // A) retreat
  if (state.time < enemy.retreatUntil) {
    moveFighter(enemy, -toPlayerX, -toPlayerY, dt);
    return;
  }

  // B) maybe start a retreat when health is low
  if (enemy.hp <= enemy.maxHp * AI.lowHpFraction && state.time >= enemy.nextRetreatRoll) {
    enemy.nextRetreatRoll = state.time + AI.retreatCheckEvery;
    if (Math.random() < AI.retreatChance) {
      enemy.retreatUntil = state.time + AI.retreatTime;
      return;
    }
  }

  // C) approach until close enough
  if (dist > AI.stopDistance) moveFighter(enemy, toPlayerX, toPlayerY, dt);

  // D) attack (useMove checks cooldown + range for us)
  if (state.time >= enemy.nextAttackAt) {
    const attacked = useMove(enemy, player, 'skill1') || useMove(enemy, player, 'basic');
    if (attacked) enemy.nextAttackAt = state.time + AI.attackPause;
  }
}

/* ---------- 8. UI UPDATES ---------- */
function updateHealthUI(f) {
  const percent = (f.hp / f.maxHp) * 100;
  f.fillEl.style.width = percent + '%';
  f.fillEl.classList.toggle('low', percent <= 30);
  f.hudFill.style.width = percent + '%';
  f.textEl.textContent = f.hp;
  f.hudText.textContent = f.hp + '/' + f.maxHp;
}

function updateCooldownUI() {
  for (const b of moveButtons) {
    const left = player.readyAt[b.key] - state.time;
    if (left > 0) {
      b.el.classList.add('cooling');
      if (b.showNumber) b.cdEl.textContent = left >= 1 ? Math.ceil(left) : left.toFixed(1);
    } else {
      b.el.classList.remove('cooling');
      if (b.showNumber) b.cdEl.textContent = '';
    }
  }
}

function render() {
  for (const f of [player, enemy]) {
    f.el.style.transform = 'translate(' + f.x + 'px,' + f.y + 'px)';
  }
  timerEl.textContent = formatTime(state.time);
  updateCooldownUI();
}

/* ---------- 9. INPUT ---------- */
// ----- Analog joystick -----
// How it works:
//  1. We compare the finger position with the CENTER of the joystick base.
//  2. distance / maxDistance (0 to 1) = how hard the stick is pushed.
//  3. Inside the dead zone nothing happens. After it, speed grows smoothly
//     from 0 to full speed (PLAYER_SPEED) as you push further.
//  4. The direction is the angle of the finger, so diagonals work naturally.
//  5. Only POINTER events move the player. Touch events below are just a
//     safety net that lets go of the stick (so input is never counted twice).
const JOY_DEADZONE = 0.12;                 // ignore pushes smaller than 12% of the range

const joy = { x: 0, y: 0, strength: 0 };   // x,y = direction (length 1), strength = 0..1
const keys = { up: false, down: false, left: false, right: false };   // keyboard
let joyPointerId = null;                   // the one finger that owns the joystick

function resetJoystick() {
  joyPointerId = null;
  joy.x = joy.y = joy.strength = 0;
  joyKnobEl.style.transform = 'translate(0px, 0px)';   // knob snaps back to the center
  joystickEl.classList.remove('active');
}

function releaseAllInputs() {
  resetJoystick();
  keys.up = keys.down = keys.left = keys.right = false;
}

// Read the finger position, move the knob, and update joy.x / joy.y / joy.strength.
function readJoystick(e) {
  const base = joystickEl.getBoundingClientRect();
  const knobWidth = joyKnobEl.getBoundingClientRect().width;
  const maxDist = (base.width - knobWidth) / 2;          // how far the knob can travel
  const dx = e.clientX - (base.left + base.width / 2);
  const dy = e.clientY - (base.top + base.height / 2);
  const dist = Math.hypot(dx, dy);
  const dirX = dist > 0 ? dx / dist : 0;
  const dirY = dist > 0 ? dy / dist : 0;

  // knob: follows the finger but never leaves the base
  const shown = Math.min(dist, maxDist);
  joyKnobEl.style.transform = 'translate(' + (dirX * shown) + 'px,' + (dirY * shown) + 'px)';

  // movement: 0 inside the dead zone, then 0..1 up to a full push
  const push = Math.min(1, dist / maxDist);
  if (push <= JOY_DEADZONE) {
    joy.x = joy.y = joy.strength = 0;
  } else {
    joy.x = dirX;
    joy.y = dirY;
    joy.strength = (push - JOY_DEADZONE) / (1 - JOY_DEADZONE);
  }
}

joystickEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  joyPointerId = e.pointerId;       // a new finger always takes over
  try { joystickEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  joystickEl.classList.add('active');
  readJoystick(e);
});
// Because of pointer capture, this keeps firing for the same finger even
// when it slides far outside the base.
joystickEl.addEventListener('pointermove', (e) => {
  if (e.pointerId === joyPointerId) readJoystick(e);
});

// Many ways to let go, so movement can never get stuck:
joystickEl.addEventListener('lostpointercapture', (e) => { if (e.pointerId === joyPointerId) resetJoystick(); });
window.addEventListener('pointerup', (e) => { if (e.pointerId === joyPointerId) resetJoystick(); });
window.addEventListener('pointercancel', (e) => { if (e.pointerId === joyPointerId) resetJoystick(); });

// Touch safety net: if no finger is left on the joystick, let go.
// (A finger that is pressing an attack button does not count.)
function fingerStillOnJoystick(e) {
  for (let i = 0; i < e.touches.length; i++) {
    if (joystickEl.contains(e.touches[i].target)) return true;
  }
  return false;
}
window.addEventListener('touchend', (e) => { if (!fingerStillOnJoystick(e)) resetJoystick(); });
window.addEventListener('touchcancel', (e) => { if (!fingerStillOnJoystick(e)) resetJoystick(); });
window.addEventListener('blur', releaseAllInputs);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllInputs(); });

// Action buttons: fire on touch-down (feels faster than waiting for release).
for (const b of moveButtons) {
  b.cdEl = b.el.querySelector('.cd');
  b.el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    useMove(player, enemy, b.key);
  });
}

// Keyboard (optional, for testing on a computer)
const KEY_DIRECTION = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right'
};
const KEY_MOVE = { KeyJ: 'basic', Space: 'basic', KeyK: 'skill1', KeyL: 'skill2', KeyU: 'ult' };

window.addEventListener('keydown', (e) => {
  if (!state.running) return;
  const dir = KEY_DIRECTION[e.code];
  if (dir) { keys[dir] = true; e.preventDefault(); }
  const moveKey = KEY_MOVE[e.code];
  if (moveKey) {
    e.preventDefault();
    if (!e.repeat) useMove(player, enemy, moveKey);
  }
});
window.addEventListener('keyup', (e) => {
  const dir = KEY_DIRECTION[e.code];
  if (dir) keys[dir] = false;
});

// Stop the page from scrolling / zooming / opening menus while playing.
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- 10. MATCH FLOW + GAME LOOP ---------- */
function startMatch() {
  menuScreen.classList.remove('active');
  gameScreen.classList.add('active');
  endScreen.classList.remove('show');

  // remove leftover effects and damage numbers from the last match
  arenaEl.querySelectorAll('.fx, .float').forEach((n) => n.remove());

  measureArena();            // the arena must be visible before we can measure it
  releaseAllInputs();
  resetFighter(player);
  resetFighter(enemy);
  placeFighters();

  state.time = 0;
  state.over = false;
  state.running = true;
  tooFarShownAt = -1;
  render();

  cancelAnimationFrame(rafId);
  lastTs = performance.now();
  rafId = requestAnimationFrame(frame);
}

function endMatch(winner) {
  state.over = true;
  state.running = false;
  releaseAllInputs();
  const won = winner === player;
  endTitle.textContent = won ? 'VICTORY' : 'DEFEAT';
  endTitle.className = won ? 'win' : 'lose';
  endTime.textContent = 'Match time ' + formatTime(state.time);
  endScreen.classList.add('show');
}

function frame(ts) {
  const dt = Math.max(0, Math.min((ts - lastTs) / 1000, 0.05));   // seconds, capped
  lastTs = ts;

  if (state.running) {
    state.time += dt;
    updatePlayerMovement(dt);
    updateEnemyAI(dt);
    render();
  }
  rafId = requestAnimationFrame(frame);
}

// If the phone is rotated or the window is resized, keep everyone inside the arena.
window.addEventListener('resize', () => {
  if (!gameScreen.classList.contains('active')) return;
  measureArena();
  clampToArena(player);
  clampToArena(enemy);
  render();
});

$('playBtn').addEventListener('click', startMatch);
$('restartBtn').addEventListener('click', startMatch);
</script>
